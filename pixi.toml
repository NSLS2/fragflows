[workspace]
name = "fragflows"
version = "0.1.0"
description = "Processing flows for X-ray crystallographic fragment screening at NSLS-II"
channels = ["conda-forge"]
platforms = ["linux-64"]

# This project needs two incompatible Python stacks:
#   * the prefect workflows require prefect 2.7.3, which pins Python 3.9 / pydantic<2
#   * the later deposition/analysis scripts use Python 3.11 and pydantic>=2
# pixi solves each environment independently, so each feature pins its own
# Python. Keep [dependencies] empty: anything placed there is shared by every
# environment and would force a single, conflicting Python version.
[dependencies]

# ---------------------------------------------------------------------------
# flows: Python 3.9 + prefect 2.7.3 (dimpleflow, ligandflow, exportflow,
# refineflow, groupdep_changed_state_flow)
# ---------------------------------------------------------------------------
[feature.flows.dependencies]
python = "3.9.*"
prefect = "2.7.3.*"
# prefect 2.7.3 imports apprise.plugins.NotifyOpsgenie, which newer apprise
# (>=1.9) removed; 1.1.0 is what the original conda env shipped.
apprise = "1.1.*"
# prefect 2.7.3 predates these libraries' breaking API changes. conda-forge's
# prefect metadata has loose bounds, so the solver otherwise pulls versions that
# fail at import. Pin to the majors the original conda env used.
anyio = "3.*"
pendulum = "2.*"
griffe = "0.21.*"
pydantic = "<2"
pandas = "1.5.*"
numpy = "*"
scipy = "*"
scikit-learn = "*"
gemmi = "*"
rdkit = "*"
pyyaml = "*"

[feature.flows.tasks]
dimpleflow = "python dimpleflow.py"
ligandflow = "python ligandflow.py"
exportflow = "python exportflow.py"
refineflow = "python refineflow.py"

# ---------------------------------------------------------------------------
# analysis: Python 3.11 + pydantic>=2 (gather_xray_data, groupdepflow,
# table_one, sf_cif_to_mtz, sync_ligands)
# ---------------------------------------------------------------------------
[feature.analysis.dependencies]
python = "3.11.*"
pydantic = ">=2"
pandas = "*"
numpy = "*"
gemmi = "*"
pyyaml = "*"
xmltodict = "*"
h5py = "*"
lxml = "*"
pytz = "*"
sqlalchemy = "*"
# pillow (PIL) is used by chimerax_images.py, which borrows this env's
# site-packages from inside ChimeraX.
pillow = "*"

[feature.analysis.tasks]
gather-xray-data = "python gather_xray_data.py"
groupdepflow = "python groupdepflow.py"
table-one = "python table_one.py"

[environments]
flows = ["flows"]
analysis = ["analysis"]
